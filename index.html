<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%237d2a3a%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#b58a93">
<title>You're Invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/petals.webp"><link rel="preload" as="image" href="assets/seal.webp">
<link rel="stylesheet" href="style.css"></head><body>
<div id="envelope" aria-hidden="false">
  <div id="tilt">
    <div class="tex back"></div>
    <div id="liner"></div>
    <div id="peek"><p class="pk-small">Together with their families</p><p class="pk-names"></p><p class="pk-small pk-date"></p></div>
    <div id="pocket"><div class="tex"></div></div>
    <div id="flap"><div class="tex"></div></div>
    <button id="seal" aria-label="Open the invitation"><span class="half l"></span><span class="half r"></span></button>
  </div>
  <p id="to" hidden></p>
  <p id="hint">Tap the seal to open</p>
  <canvas id="dust" aria-hidden="true"></canvas>
</div>
<main id="card" tabindex="-1">
  <div class="paper">
    <section class="hero rv"><p class="greet" id="greet" hidden></p><p class="label" id="tagline"></p>
      <h1><span class="n1"></span><span class="amp">&amp;</span><span class="n2"></span></h1>
      <div class="orn" aria-hidden="true"></div>
      <p id="date" class="date"></p><p id="countdown" class="small" aria-live="polite"></p></section>
    <section class="rv"><h2 class="label">The Venue</h2><p id="vname" class="big"></p><p id="vaddr" class="small"></p><a id="map" class="btn ghost" target="_blank" rel="noopener">Open in Maps</a></section>
    <section class="rv"><h2 class="label">Order of the Day</h2><ol id="sched"></ol></section>
    <section class="rv"><h2 class="label">Kindly Reply</h2><p id="deadline" class="small"></p>
      <form id="rsvp">
        <label>Name<input name="name" autocomplete="name" required></label>
        <fieldset><legend class="sr">Attendance</legend>
          <label class="opt"><input type="radio" name="attend" value="Joyfully accepts" checked> Joyfully accepts</label>
          <label class="opt"><input type="radio" name="attend" value="Regretfully declines"> Regretfully declines</label></fieldset>
        <label>Number in party<input name="guests" type="number" min="1" max="10" value="1" inputmode="numeric"></label>
        <label>A note for the couple <span class="small">(optional)</span><textarea name="note" rows="3"></textarea></label>
        <button class="btn solid">Send reply</button><p id="rsvpmsg" class="small" role="status"></p></form></section>
    <section class="rv"><a id="ics" class="btn ghost">Add to Calendar</a><div class="orn" aria-hidden="true"></div><p class="mono" id="mono"></p></section>
  </div>
  <div class="tools"><button id="replay" class="chip" aria-label="Replay the opening">↺ Replay</button><button id="music" class="chip" hidden aria-pressed="false">♪ Music</button></div>
</main>
<audio id="audio" loop preload="none"></audio>
<script src="app.js"></script></body></html>
